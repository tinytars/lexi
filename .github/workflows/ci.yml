name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck --workspace packages/frame

  lexitar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lexitar
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: .
      - run: npm run check
      - run: npm run build
      - run: npm run test
      - run: npx playwright install --with-deps chromium
      # Every spec runs against synthetic patients + the local e2e-only clinician/support accounts
      # (tests/e2e/_synthetic.ts) — none of them needs a credential or touches real patient data.
      #
      # NODE_OPTIONS mirrors `npm run test:e2e` — some spec files import a raw .ts entry point
      # straight from node_modules (e.g. @pablotech/akesi), which Node refuses to type-strip
      # without this loader (scripts/e2e-node-modules-ts-hooks.mjs).
      - run: npx playwright test
        env:
          NODE_OPTIONS: --import ./scripts/e2e-node-modules-ts-register.mjs

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-frame
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
          persist-credentials: true
      - name: Bump patch version
        id: bump
        working-directory: packages/frame
        run: |
          version=$(node -p "require('./package.json').version")
          IFS='.' read -r major minor patch <<< "$version"
          patch=$((patch + 1))
          while git rev-parse -q --verify "refs/tags/frame-v$major.$minor.$patch" >/dev/null; do
            patch=$((patch + 1))
          done
          new_version="$major.$minor.$patch"
          npm version "$new_version" --no-git-tag-version
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
      - name: Commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/frame/package.json package-lock.json
          git commit -m "chore(release): frame v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "frame-v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "frame-v${{ steps.bump.outputs.version }}"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Publish to npm
        working-directory: packages/frame
        run: npm publish --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "frame-v${{ steps.bump.outputs.version }}" --generate-notes
