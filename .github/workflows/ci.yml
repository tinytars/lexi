name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck --workspace packages/frame
      - run: npm test --workspace packages/frame

  lexitar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/lexitar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: .
      - run: npm run check
      - run: npm run lint
      - run: npm run build
      # functions/api/_middleware.ts must never migrate to functions/_middleware.ts: Pages would then
      # generate include:["/*"] and bill a Worker invocation for every chunk, font and favicon.
      - name: Pages routing stays scoped to /api/*
        run: |
          T=$(mktemp -d)
          npx wrangler pages functions build --outdir "$T/out" --output-routes-path "$T/routes.json"
          jq -e '.include == ["/api/*"]' "$T/routes.json"
      - run: npm run coverage
      # The same unit suite with the Node host's adapters (SQLite + filesystem blobs) standing in for
      # Miniflare's D1/R2 — see tests/support/miniflare.ts.
      - run: npm test
        env:
          TEST_BACKEND: node
      - name: Coverage thresholds only rise
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git show FETCH_HEAD:apps/lexitar/coverage-thresholds.json > "$RUNNER_TEMP/base-thresholds.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/base-thresholds.json"
          npx tsx scripts/coverage-ratchet.ts "$RUNNER_TEMP/base-thresholds.json" coverage-thresholds.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lexitar-coverage
          path: apps/lexitar/coverage/coverage-summary.json
      - run: npx playwright install --with-deps chromium
      # Every spec runs against synthetic patients + the local e2e-only clinician/support accounts
      # (tests/e2e/_synthetic.ts) — none of them needs a credential or touches real patient data.
      #
      # NODE_OPTIONS mirrors `npm run test:e2e` — some spec files import a raw .ts entry point
      # straight from node_modules (e.g. @pablotech/akesi), which Node refuses to type-strip
      # without this loader (scripts/e2e-node-modules-ts-hooks.mjs).
      - run: npx playwright test
        env:
          NODE_OPTIONS: --import ./scripts/e2e-node-modules-ts-register.mjs
      # The whole suite again against the Node self-host (server/node.ts): the proof that the backend
      # is not tied to Cloudflare.
      - run: npx playwright test
        env:
          NODE_OPTIONS: --import ./scripts/e2e-node-modules-ts-register.mjs
          E2E_HOST: node
          E2E_SKIP_BUILD: 1

  lexitar-data:
    # Credential-bound tests (DATA_TESTS in vitest.config.ts). Fork PRs get no secrets, so skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/lexitar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
        working-directory: .
      - run: npm run test:data
        env:
          ORG_KEY_PASSPHRASE: ${{ secrets.ORG_KEY_PASSPHRASE }}

  lexitar-image:
    # Boots the Node self-host image and probes a static page, a D1-backed route, and the data volume.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f apps/lexitar/Dockerfile -t lexitar .
      - run: docker run -d --name lexitar -p 8788:8788 -e SESSION_SECRET=ci -e STORE_PREFIX=ci lexitar
      - run: |
          for i in $(seq 30); do curl -sf -o /dev/null http://localhost:8788/ && break; sleep 1; done
          curl -sf http://localhost:8788/ | grep -q '<div id="app"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8788/api/account)" = 401
          docker exec lexitar test -s /data/lexi.sqlite
      - if: failure()
        run: docker logs lexitar

  autopilot-guard:
    # The rules it enforces are in .github/autopilot.json. WHICH pull requests it applies to is an
    # input, never a job-level `if:` — a required check that reports SKIPPED blocks the merge
    # forever. The `if:` below is about event type, not applicability: it is true for every pull
    # request, so the check always reports on the path where it is required to.
    #
    # On a direct push it does skip, which is why `autopilot-guard / guard` is never satisfied on
    # a push to `dev` and a human landing a branch there uses the admin bypass. plover-code's copy
    # runs on pushes and reports "nothing to check" instead; this one has not been changed to match.
    if: github.event_name == 'pull_request'
    uses: promontory-studio/pedalion-ci/.github/workflows/guard.yml@0185de09d9447da6d439a1f0823c1631a5c0eb25 # v1.0.0
    with:
      base-ref: ${{ github.base_ref }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      authors: plover-autopilot[bot],pedalion[bot],dependabot[bot]
      pr-author: ${{ github.event.pull_request.user.login }}
      head-branch: ${{ github.head_ref }}
      skip-branch-prefixes: promote/

  release:
    needs: [test, lexitar, lexitar-data]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    concurrency:
      group: release-frame
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}
          persist-credentials: true
      - name: Bump patch version
        id: bump
        working-directory: packages/frame
        run: |
          version=$(node -p "require('./package.json').version")
          IFS='.' read -r major minor patch <<< "$version"
          patch=$((patch + 1))
          while git rev-parse -q --verify "refs/tags/frame-v$major.$minor.$patch" >/dev/null; do
            patch=$((patch + 1))
          done
          new_version="$major.$minor.$patch"
          npm version "$new_version" --no-git-tag-version
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
      - name: Commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add packages/frame/package.json package-lock.json
          git commit -m "chore(release): frame v${{ steps.bump.outputs.version }} [skip ci]"
          git tag "frame-v${{ steps.bump.outputs.version }}"
          git push origin HEAD:main
          git push origin "frame-v${{ steps.bump.outputs.version }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Publish to npm
        working-directory: packages/frame
        run: npm publish --provenance --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "frame-v${{ steps.bump.outputs.version }}" --generate-notes

  # Pages deploys through the git integration, not through CI, so a failed build is invisible here:
  # the branch quietly keeps serving the previous bundle while this workflow stays green and the
  # promotion gate reads that green as "dev is deployed".
  pages-deploy:
    needs: [lexitar]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm ci
      - run: npx tsx apps/lexitar/scripts/pages-deploy-status.ts "$PROJECT" "$GITHUB_SHA"
        env:
          PROJECT: ${{ github.ref == 'refs/heads/main' && 'health-dash-main' || 'health-dash-dev' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Only on push: a red PR run is already in front of the person who caused it, but a red dev or
  # main run is unattended.
  notify-failure:
    needs: [test, lexitar, lexitar-data, lexitar-image, autopilot-guard, release, pages-deploy]
    if: always() && github.event_name == 'push' && contains(needs.*.result, 'failure')
    uses: promontory-studio/pedalion-ci/.github/workflows/notify-failure.yml@0185de09d9447da6d439a1f0823c1631a5c0eb25 # v1.0.0
    # `secrets: inherit` does not cross owners, so every secret is named.
    secrets:
      app-key: ${{ secrets.AUTOPILOT_APP_KEY }}
    with:
      issue-repo: promontory-studio/plover-factory
      app-id: ${{ vars.AUTOPILOT_APP_ID }}
      assignee: pablo-tech
      title: CI failed on a branch that deploys
      context: A push to dev or main broke CI. Until it is green the promotion gate will not promote, and the branch may be serving a bundle nobody verified.
