name: Claude PR Review

# The review runs on CI's completion rather than watching checks from inside itself
# (which would include itself and deadlock — see pablo-tech/pilos#10). It approves and
# enables auto-merge; the dev/main rulesets then merge only once every required check
# is green.
#
# vars.AUTOPILOT gates the merge: `on` enables auto-merge after approval (unless the PR
# is labeled `hold`), `dry-run` (or unset) stops at approval, `off` skips review.
#
# push-audit stays here: it is an after-the-fact read of a direct push to main, not part
# of the pull-request pipeline the shared workflow implements.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

concurrency:
  group: claude-review-${{ github.event.workflow_run.pull_requests[0].number || github.sha }}
  cancel-in-progress: true

jobs:
  review:
    if: >
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.pull_requests[0] != null
    uses: promontory-studio/autopilot/.github/workflows/review.yml@2c52091f36c1e2da50624954f826f31c31b0b536
    # `secrets: inherit` does not cross owners, so every secret is named.
    secrets:
      anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
      app-key: ${{ secrets.AUTOPILOT_APP_KEY }}
      # plover-autopilot is not installed on promontory-studio; this PAT is what reaches plover-factory.
      repair-token: ${{ secrets.RELEASE_PAT }}
    with:
      mode: ${{ vars.AUTOPILOT || 'dry-run' }}
      pr-number: ${{ github.event.workflow_run.pull_requests[0].number }}
      head-sha: ${{ github.event.workflow_run.head_sha }}
      ci-conclusion: ${{ github.event.workflow_run.conclusion }}
      head-branch: ${{ github.event.workflow_run.head_branch }}
      allowed-bots: dependabot[bot],plover-autopilot[bot]
      # A security update is raised against main whatever dependabot.yml targets, and main receives
      # dev whole — a merge there diverges it. The host moves the pull request onto dev and asks
      # Dependabot to rebase it there, so it stops carrying main's kept-back wrangler.jsonc. The
      # promotion pull request is untouched: the move is keyed on the dependabot/ branch prefix.
      retarget-base: dev
      # A promotion into main keeps dev's history, as every promotion has.
      merge-method-by-base: '{"main":"merge"}'
      app-id: ${{ vars.AUTOPILOT_APP_ID }}
      repair-repo: promontory-studio/plover-factory
      repair-event: dependabot-broken

  push-audit:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - uses: anthropics/claude-code-base-action@v0.0.63
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: "claude-sonnet-5"
          allowed_tools: "Read,Grep,Glob,Bash(git show:*),Bash(gh api repos/*/commits/*/comments:*)"
          prompt: |
            A commit was just pushed directly to main, bypassing PR review.
            Review its diff with `git show HEAD`. Only if you find a blocking
            correctness bug, post a commit comment explaining it with
            `gh api repos/${{ github.repository }}/commits/${{ github.sha }}/comments -f body="..."`.
            Say nothing and take no action if the commit looks fine — this is
            an audit pass, not a gate, since the commit is already merged.

  notify-failure:
    needs: [review, push-audit]
    if: always() && contains(needs.*.result, 'failure')
    uses: promontory-studio/autopilot/.github/workflows/notify-failure.yml@2c52091f36c1e2da50624954f826f31c31b0b536
    # `secrets: inherit` does not cross owners, so every secret is named.
    secrets:
      app-key: ${{ secrets.AUTOPILOT_APP_KEY }}
      # plover-autopilot is not installed on promontory-studio; this PAT is what reaches plover-factory.
      issue-token: ${{ secrets.RELEASE_PAT }}
    with:
      issue-repo: promontory-studio/plover-factory
      app-id: ${{ vars.AUTOPILOT_APP_ID }}
      assignee: pablo-tech
      title: Claude PR review workflow failed
      context: The review automation itself broke, so pushes are going unreviewed until it is fixed.
