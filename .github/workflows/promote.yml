name: promote

# Opens the dev -> main promotion PR once dev has soaked, keeping main's prod wrangler.jsonc
# exactly as every hand promotion has. claude-review.yml then reviews and merges it like any
# other PR. Veto: label the PR `hold`, or set AUTOPILOT_PROMOTE=off.
# Scheduled runs fire only from main, so the schedule is live once this file is promoted.

on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      # The 24 h soak is the policy and the default below IS that policy - a scheduled run passes
      # nothing and gets it. What this input adds is a route to depart from it that leaves a
      # record: the number used is written into the run, beside who dispatched it and when, which
      # a gate quietly edited to 0 would not be. The reusable workflow has accepted `soak-hours`
      # since it was written; this repository had simply never wired it, so the only way to
      # promote ahead of the window was to edit the gate, and the only way to know afterwards
      # that someone had was to read the diff.
      #
      # Lowering it is a judgement about ONE promotion's contents, never a standing setting.
      # It is defensible when `git diff origin/main..origin/dev` touches no code a user reaches -
      # continuous-integration configuration, dependency bumps, a test - and the window would
      # then be soaking a comment. It is not defensible for anything under `apps/lexitar/src`,
      # `apps/lexitar/functions` or `packages/frame/src`, which is what the window exists for.
      soak-hours:
        description: Hours dev must have soaked. Leave at 24 unless the diff reaches no user.
        type: string
        default: "24"

permissions:
  contents: write
  pull-requests: write

jobs:
  # The canary issue is found by a label derived from the canary message rather than written
  # down, so it has to be computed from this repository's code before the gate can look it up.
  canary:
    if: vars.AUTOPILOT != 'off' && vars.AUTOPILOT_PROMOTE != 'off' && vars.AUTOPILOT_APP_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      label: ${{ steps.fingerprint.outputs.label }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - id: fingerprint
        run: echo "label=$(npx tsx apps/lexitar/scripts/canary-label.ts)" >> "$GITHUB_OUTPUT"

  promote:
    needs: [canary]
    uses: promontory-studio/pedalion-ci/.github/workflows/promote.yml@c9b494b5674aaac7465882629455531b8dc28898 # v1.4.0
    # `secrets: inherit` does not cross owners, so every secret is named.
    secrets:
      app-key: ${{ secrets.AUTOPILOT_APP_KEY }}
    with:
      mode: ${{ vars.AUTOPILOT_PROMOTE || 'on' }}
      # `github.event.inputs` and not `inputs`: the latter does not exist on a scheduled run, so
      # reading it there yields nothing and `fromJSON` fails on the empty string. The fallback is
      # what makes the schedule carry the policy. `fromJSON` is needed because a workflow_dispatch
      # input cannot be declared `type: number` and the reusable workflow's is one.
      soak-hours: ${{ fromJSON(github.event.inputs['soak-hours'] || '24') }}
      keep-paths: apps/lexitar/wrangler.jsonc
      report-repo: promontory-studio/plover-factory
      canary-label: ${{ needs.canary.outputs.label }}
      app-id: ${{ vars.AUTOPILOT_APP_ID }}

  notify-failure:
    needs: [canary, promote]
    if: always() && contains(needs.*.result, 'failure')
    uses: promontory-studio/pedalion-ci/.github/workflows/notify-failure.yml@c9b494b5674aaac7465882629455531b8dc28898 # v1.4.0
    # `secrets: inherit` does not cross owners, so every secret is named.
    secrets:
      app-key: ${{ secrets.AUTOPILOT_APP_KEY }}
    with:
      issue-repo: promontory-studio/plover-factory
      app-id: ${{ vars.AUTOPILOT_APP_ID }}
      assignee: pablo-tech
      title: Promotion workflow failed
      context: dev is not reaching main by automation. A gate that blocks promotion exits clean; a failure here means the workflow itself broke.
