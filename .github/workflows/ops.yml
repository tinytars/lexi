name: ops

# The dispatch surface for lexitar's live vault operations — the R2/D1-native replacement for
# plover-code's ops.yml, ported here now that scripts/orphan-sweep.ts reads and writes R2/D1
# directly, with no dependency on plover-code's local plaintext vault mirror.
#
# sync_pages_secret (below) is a boolean modifier, not an `op` choice: it is project-wide, not
# per-client, and must never run through lexitar-op (that action asserts a run command — wrong
# shape for something that touches neither R2 nor D1). Ported from plover-code's own ops.yml once
# the Cloudflare Pages repoint (migration plan Phase 6) made health-dash-dev a project this repo's
# runs can legitimately push a secret to. plover-code's copy is gone; this is the only one.
#
# A NEW OPERATIONAL FLOW IS AN ENTRY IN THIS FILE, NEVER A SECOND WORKFLOW — the discipline
# plover-code's ops.yml carried before it was retired, for the reason it carried it (three
# near-identical workflows drifting independently). AND AN ENTRY IS ALSO A CLAIM THAT THE
# OPERATION CAN RUN ON A HOSTED RUNNER, which is what 2026-10-19 adds to that rule: an operation
# that cannot belongs in apps/lexitar/docs/OPS-LOCAL.md instead, and a menu listing one is a form
# that can only fail.
#
# TWELVE OPS LEFT THIS FILE ON 2026-10-19 AND ARE NOW IN apps/lexitar/docs/OPS-LOCAL.md — every
# `r2-ops` operation plus `raw-backfill`, `raw-pages-backfill`, `raw-encrypt-backfill` and
# `recovery-approve`. Not a deprecation: not one of them could ever run here. Each reaches
# scripts/org-unwrap.ts, measured transitively from each entrypoint, so each needs the org PRIVATE
# key, and the key file never arrives — scripts/org-key.ts:33 resolves ORG_KEY_PATH or a credential
# store's org-key.json with no in-repo fallback, and no workflow here sets either. So they were
# menu entries that installed the repository, billed the minutes and failed on the key, every time.
# `orphan-sweep` is the one op in that group that does NOT reach the org key, which is why it is the
# one that stayed. The fix, if the others are ever wanted in CI, is a decision and not a config
# change: putting the org private key in Actions secrets gives every workflow-dispatch a recovery
# envelope into every vault, which the remediation of 2026-10 deliberately declined. That document
# carries the commands, since these case arms were the only written copy of them.
#
# THE `client` AND `reason` INPUTS WENT WITH THEM, AND THAT HALF IS NOT ABOUT THE ORG KEY. This
# repository is public, so a dispatch's inputs and its run page are readable by anyone. `client`
# took an account id — and for `recovery-approve` the patient's own email address — while `reason`
# was free text that ./.github/actions/lexitar-op echoed into the run summary. A run page naming
# who an operation was run for is a disclosure whether or not the run then failed on a missing key.
# `orphan-sweep` is store-wide and reads neither, so nothing was traded away to remove them; the
# per-client concurrency key went too, having spelled an account id into a group name. `force`,
# `marker`, `name` and `purge_unreadable` are gone for the duller reason that nothing reads them
# any more.
#
# THE ONE CARVE-OUT TO THE RULE ABOVE: `record:export` (apps/lexitar/VAULT.md §4a) is deliberately not
# an op here, and must not become one. Every op in this file reads PHI and writes ciphertext back; that
# one decrypts a whole record to the filesystem it runs on, and on a hosted runner that filesystem is
# not the operator's. It stays a local command, like scripts/treatment-diagnose.ts.

on:
  workflow_dispatch:
    inputs:
      op:
        description: "Operation (the only one that can run on a hosted runner — see apps/lexitar/docs/OPS-LOCAL.md for the rest)"
        required: true
        type: choice
        options:
          - orphan-sweep
      preview:
        description: "No Anthropic call, no R2 write — print what the real run would do"
        required: true
        type: boolean
        default: true
      extra_args:
        description: "Escape hatch for uncurated CLI flags. Whitespace-split, each token shell-quoted."
        type: string
        default: ""
      sync_pages_secret:
        description: "Push secrets.ANTHROPIC_API_KEY to health-dash-dev's Cloudflare Pages project as ANTHROPIC_API_KEY + RANGES_ANTHROPIC_API_KEY, then exit. Ignores op/preview/etc — op still must be picked to satisfy the form, but does nothing."
        type: boolean
        default: false

# vault-sync.ts's operator push re-reads the etag immediately before the write and cannot close the
# window (no conditional option on `wrangler r2 object put`) — serializing runs is what keeps that
# race theoretical rather than likely. The group is a constant rather than per-client because the
# one remaining op is store-wide, and because a group name is part of a public run's metadata.
# Never cancel in progress: a run killed mid-write leaves the deployed vault in an inconsistent state.
concurrency:
  group: vault-ops
  cancel-in-progress: false

jobs:
  op:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.preview && 10 || 15 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # sync_pages_secret's own path — deliberately not lexitar-op (see the header comment): no
      # R2/D1 touch, nothing to preview. Own Node setup + install because it never reaches the
      # composite action that would otherwise provide them.
      - name: Set up Node (sync_pages_secret only)
        if: ${{ inputs.sync_pages_secret }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install (sync_pages_secret only)
        if: ${{ inputs.sync_pages_secret }}
        run: npm ci

      - name: Sync Cloudflare Pages Anthropic secret
        if: ${{ inputs.sync_pages_secret }}
        shell: bash
        working-directory: apps/lexitar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # RANGES_ANTHROPIC_API_KEY is checked first by leaf-regen.ts and refresh-range.ts — both
          # get the same value so neither can silently fall back to a stale one.
          echo "$ANTHROPIC_API_KEY" | npx wrangler pages secret put ANTHROPIC_API_KEY --project-name health-dash-dev
          echo "$ANTHROPIC_API_KEY" | npx wrangler pages secret put RANGES_ANTHROPIC_API_KEY --project-name health-dash-dev
          {
            echo "### sync_pages_secret"
            echo
            echo "Pushed \`secrets.ANTHROPIC_API_KEY\` to health-dash-dev as ANTHROPIC_API_KEY + RANGES_ANTHROPIC_API_KEY."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve the command
        if: ${{ !inputs.sync_pages_secret }}
        id: plan
        env:
          # Every dispatcher-supplied value reaches the shell as an environment variable, never
          # interpolated into the script text — `${{ inputs.extra_args }}` spliced into a `run:`
          # block is a script-injection hole; "$EXTRA" is not.
          OP: ${{ inputs.op }}
          PREVIEW: ${{ inputs.preview }}
          EXTRA: ${{ inputs.extra_args }}
        run: |
          set -euo pipefail
          # In a shell step a `type: boolean` input renders as the literal text true/false.
          preview=false; if [ "$PREVIEW" = "true" ]; then preview=true; fi
          note=""
          exception=""

          # One arm, and still a `case`: an unknown op must fail loudly rather than run the only
          # command this file has. A choice input constrains the form and not the API.
          case "$OP" in
            orphan-sweep)
              # Store-wide, so there is no client to assert. A real run only dates orphans;
              # deleting them needs --delete in extra_args, deliberately.
              cmd="npx tsx scripts/orphan-sweep.ts"
              if ! $preview; then cmd="$cmd --record"; fi
              ;;
            *) echo "unknown op: $OP — see apps/lexitar/docs/OPS-LOCAL.md, which has the twelve that run locally" >&2; exit 1 ;;
          esac

          if [ -n "$EXTRA" ]; then
            for tok in $EXTRA; do cmd="$cmd $(printf %q "$tok")"; done
            note="Extra arguments were supplied; the preview contract holds only if they do not add a write flag."
          fi

          {
            echo "cmd=$cmd"
            echo "note=$note"
            echo "exception=$exception"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/lexitar-op
        if: ${{ !inputs.sync_pages_secret }}
        with:
          op: ${{ inputs.op }}
          run: ${{ steps.plan.outputs.cmd }}
          preview: ${{ inputs.preview }}
          preview-note: ${{ steps.plan.outputs.note }}
          preview-exception: ${{ steps.plan.outputs.exception }}
          org-key-passphrase: ${{ secrets.ORG_KEY_PASSPHRASE }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
