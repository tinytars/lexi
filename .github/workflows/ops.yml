name: ops

# The dispatch surface for lexitar's live vault operations — the R2/D1-native replacement for
# plover-code's ops.yml, ported here now that scripts/r2-ops-cli.ts (refresh-finding,
# refresh-ranges, refresh-marker-groups, process-pending, reconcile, sync-treatment-attachments,
# treatment-groups-backfill, treatment-photo-extract) and scripts/raw-backfill.ts /
# scripts/recovery-approve.ts / scripts/orphan-sweep.ts read and write R2/D1 directly, with no dependency on plover-code's
# local plaintext vault mirror.
#
# sync_pages_secret (below) is a boolean modifier, not an `op` choice: it is project-wide, not
# per-client, and must never run through lexitar-op (that action asserts a client and a run
# command — wrong shape for something that touches neither). Ported from plover-code's own
# ops.yml once the Cloudflare Pages repoint (migration plan Phase 6) made health-dash-dev a
# project this repo's runs can legitimately push a secret to. plover-code's copy is gone; this is
# the only one.
#
# A NEW OPERATIONAL FLOW IS AN ENTRY IN THIS FILE, NEVER A SECOND WORKFLOW — the discipline
# plover-code's ops.yml carried before it was retired, for the reason it carried it (three
# near-identical workflows drifting independently).

on:
  workflow_dispatch:
    inputs:
      op:
        description: "Operation"
        required: true
        type: choice
        options:
          - refresh-finding
          - refresh-ranges
          - refresh-marker-groups
          - process-pending
          - reconcile
          - sync-treatment-attachments
          - treatment-groups-backfill
          - treatment-photo-extract
          - raw-backfill
          - raw-pages-backfill
          - raw-encrypt-backfill
          - orphan-sweep
          - recovery-approve
      client:
        description: "Client id (e.g. alex). Ignored by raw-backfill, raw-pages-backfill, raw-encrypt-backfill and orphan-sweep, which are store-wide. recovery-approve reads this as the patient's account email instead. Omit for reconcile to fan out across every deployed vault."
        required: false
        type: string
      preview:
        description: "No Anthropic call, no R2 write — print what the real run would do"
        required: true
        type: boolean
        default: true
      force:
        description: "Regenerate even when the plan says nothing changed (refresh-finding, refresh-ranges, refresh-marker-groups)"
        type: boolean
        default: false
      marker:
        description: "refresh-ranges: one marker name, or `all` for every marker with readings"
        type: string
        default: ""
      name:
        description: "sync-treatment-attachments: optional treatment name filter (omit for every treatment). treatment-photo-extract: required treatment name to patch."
        type: string
        default: ""
      extra_args:
        description: "Escape hatch for uncurated CLI flags. Whitespace-split, each token shell-quoted."
        type: string
        default: ""
      reason:
        description: "Why this run is happening — echoed into the summary"
        type: string
        default: ""
      purge_unreadable:
        description: "raw-pages-backfill only: also DELETE the PDFs no parser can open. Irreversible outside the snapshot window; ignored unless preview is false."
        type: boolean
        default: false
      sync_pages_secret:
        description: "Push secrets.ANTHROPIC_API_KEY to health-dash-dev's Cloudflare Pages project as ANTHROPIC_API_KEY + RANGES_ANTHROPIC_API_KEY, then exit. Ignores op/client/preview/etc — op still must be picked to satisfy the form, but does nothing."
        type: boolean
        default: false

# vault-sync.ts's operator push re-reads the etag immediately before the write and cannot close the
# window (no conditional option on `wrangler r2 object put`) — serializing per-client runs is what
# keeps that race theoretical rather than likely. Never cancel in progress: a run killed mid-write
# leaves the deployed vault in an inconsistent state.
concurrency:
  group: vault-${{ inputs.client }}
  cancel-in-progress: false

jobs:
  op:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.preview && 10 || fromJSON('{"refresh-finding":45,"refresh-ranges":30,"refresh-marker-groups":20,"process-pending":30,"reconcile":20,"sync-treatment-attachments":10,"treatment-groups-backfill":30,"treatment-photo-extract":10,"raw-backfill":15,"raw-pages-backfill":30,"raw-encrypt-backfill":45,"orphan-sweep":15,"recovery-approve":5}')[inputs.op] }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # sync_pages_secret's own path — deliberately not lexitar-op (see the header comment): no
      # client, no R2/D1 touch, nothing to preview. Own Node setup + install because it never
      # reaches the composite action that would otherwise provide them.
      - name: Set up Node (sync_pages_secret only)
        if: ${{ inputs.sync_pages_secret }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install (sync_pages_secret only)
        if: ${{ inputs.sync_pages_secret }}
        run: npm ci

      - name: Sync Cloudflare Pages Anthropic secret
        if: ${{ inputs.sync_pages_secret }}
        shell: bash
        working-directory: apps/lexitar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -euo pipefail
          # RANGES_ANTHROPIC_API_KEY is checked first by leaf-regen.ts and refresh-range.ts — both
          # get the same value so neither can silently fall back to a stale one.
          echo "$ANTHROPIC_API_KEY" | npx wrangler pages secret put ANTHROPIC_API_KEY --project-name health-dash-dev
          echo "$ANTHROPIC_API_KEY" | npx wrangler pages secret put RANGES_ANTHROPIC_API_KEY --project-name health-dash-dev
          {
            echo "### sync_pages_secret"
            echo
            echo "Pushed \`secrets.ANTHROPIC_API_KEY\` to health-dash-dev as ANTHROPIC_API_KEY + RANGES_ANTHROPIC_API_KEY."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve the command
        if: ${{ !inputs.sync_pages_secret }}
        id: plan
        env:
          # Every dispatcher-supplied value reaches the shell as an environment variable, never
          # interpolated into the script text — `${{ inputs.client }}` spliced into a `run:` block
          # is a script-injection hole; "$CLIENT" is not.
          OP: ${{ inputs.op }}
          CLIENT: ${{ inputs.client }}
          PREVIEW: ${{ inputs.preview }}
          FORCE: ${{ inputs.force }}
          MARKER: ${{ inputs.marker }}
          NAME: ${{ inputs.name }}
          PURGE: ${{ inputs.purge_unreadable }}
          EXTRA: ${{ inputs.extra_args }}
        run: |
          set -euo pipefail
          # In a shell step a `type: boolean` input renders as the literal text true/false.
          preview=false; if [ "$PREVIEW" = "true" ]; then preview=true; fi
          force="";      if [ "$FORCE" = "true" ]; then force="--force"; fi
          note=""
          exception=""

          case "$OP" in
            refresh-finding)
              [ -n "$CLIENT" ] || { echo "refresh-finding needs a client id" >&2; exit 1; }
              cmd="npm run r2-ops -- --refresh-finding --client $(printf %q "$CLIENT") $force"
              # --dry-run carries the same no-Anthropic-call guarantee refresh-finding-preview.ts
              # gave in plover-code (refresh.ts:44-50) — it prints the plan and returns.
              if $preview; then cmd="$cmd --dry-run"; fi
              ;;
            refresh-ranges)
              [ -n "$CLIENT" ] || { echo "refresh-ranges needs a client id" >&2; exit 1; }
              case "$MARKER" in
                "")    echo "refresh-ranges needs a marker name, or all" >&2; exit 1 ;;
                all)   sel="--all-markers" ;;
                *)     sel="--marker $(printf %q "$MARKER")" ;;
              esac
              cmd="npm run r2-ops -- --refresh-ranges --client $(printf %q "$CLIENT") $sel $force"
              if $preview; then cmd="$cmd --dry-run"; fi
              ;;
            refresh-marker-groups)
              [ -n "$CLIENT" ] || { echo "refresh-marker-groups needs a client id" >&2; exit 1; }
              cmd="npm run r2-ops -- --refresh-marker-groups --client $(printf %q "$CLIENT") $force"
              if $preview; then cmd="$cmd --dry-run"; fi
              ;;
            process-pending)
              [ -n "$CLIENT" ] || { echo "process-pending needs a client id" >&2; exit 1; }
              cmd="npm run r2-ops -- --process-pending --client $(printf %q "$CLIENT")"
              if $preview; then cmd="$cmd --dry-run"; fi
              ;;
            reconcile)
              if [ -n "$CLIENT" ]; then
                cmd="npm run r2-ops -- --reconcile --client $(printf %q "$CLIENT")"
              else
                cmd="npm run r2-ops -- --reconcile"
              fi
              if $preview; then cmd="$cmd --dry-run"; fi
              ;;
            sync-treatment-attachments)
              [ -n "$CLIENT" ] || { echo "sync-treatment-attachments needs a client id" >&2; exit 1; }
              cmd="npm run r2-ops -- --sync-treatment-attachments --client $(printf %q "$CLIENT")"
              if [ -n "$NAME" ]; then cmd="$cmd $(printf %q "$NAME")"; fi
              if $preview; then cmd="$cmd --dry-run"; fi
              ;;
            treatment-groups-backfill)
              [ -n "$CLIENT" ] || { echo "treatment-groups-backfill needs a client id" >&2; exit 1; }
              cmd="npm run r2-ops -- --treatment-groups-backfill --client $(printf %q "$CLIENT")"
              if $preview; then cmd="$cmd --dry-run"; fi
              ;;
            treatment-photo-extract)
              [ -n "$CLIENT" ] || { echo "treatment-photo-extract needs a client id" >&2; exit 1; }
              [ -n "$NAME" ] || { echo "treatment-photo-extract needs a treatment name (name input)" >&2; exit 1; }
              cmd="npm run r2-ops -- --treatment-photo-extract --client $(printf %q "$CLIENT") --name $(printf %q "$NAME")"
              # --id/--key have no menu entry — pass via extra_args, e.g. "--key raw/abc.jpg --key raw/def.jpg --id row_123"
              if $preview; then cmd="$cmd --dry-run"; fi
              ;;
            raw-backfill)
              # Store-wide against D1, not per-client; `client` only sets the concurrency key.
              cmd="npx tsx scripts/raw-backfill.ts"
              if ! $preview; then cmd="$cmd --confirm"; fi
              ;;
            raw-pages-backfill)
              # Store-wide, like raw-backfill. Reads every PDF in the store to count its pages, so it
              # is the slowest op here; the preview reads them too and writes nothing.
              cmd="npx tsx scripts/raw-pages-backfill.ts"
              if ! $preview; then cmd="$cmd --confirm"; fi
              # The purge deletes patient files whose only undo is the nightly snapshot, so it is its
              # own input rather than an extra_args token: a run's recorded parameters then say
              # whether this run could delete, without anyone parsing a command line.
              if [ "$PURGE" = "true" ]; then
                cmd="$cmd --purge-unreadable"
                if $preview; then
                  exception="purge_unreadable was requested; this preview still writes and deletes nothing."
                else
                  note="This run DELETES the unreadable files it finds. The nightly snapshot is the only undo."
                fi
              fi
              ;;
            raw-encrypt-backfill)
              # Store-wide, like raw-backfill. It reads and rewrites every plaintext original, so the
              # preview reads them all too and writes nothing — the counts it prints are the migration's
              # remaining work. A real run overwrites patient objects IN PLACE; the nightly snapshot is
              # the only undo, so verify `npm run vault:snapshot:check` is green before dispatching one.
              cmd="npx tsx scripts/raw-encrypt-backfill.ts"
              if ! $preview; then
                cmd="$cmd --confirm"
                note="This run OVERWRITES patient objects in place with their sealed form. The nightly snapshot is the only undo."
              fi
              ;;
            orphan-sweep)
              # A real run only dates orphans; deleting them needs --delete in extra_args, deliberately.
              cmd="npx tsx scripts/orphan-sweep.ts"
              if ! $preview; then cmd="$cmd --record"; fi
              ;;
            recovery-approve)
              [ -n "$CLIENT" ] || { echo "recovery-approve needs the patient's account email as client" >&2; exit 1; }
              cmd="npm run recovery:approve -- --email $(printf %q "$CLIENT")"
              if ! $preview; then cmd="$cmd --confirm"; fi
              ;;
            *) echo "unknown op: $OP" >&2; exit 1 ;;
          esac

          if [ -n "$EXTRA" ]; then
            for tok in $EXTRA; do cmd="$cmd $(printf %q "$tok")"; done
            note="Extra arguments were supplied; the preview contract holds only if they do not add a write flag."
          fi

          {
            echo "cmd=$cmd"
            echo "note=$note"
            echo "exception=$exception"
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/lexitar-op
        if: ${{ !inputs.sync_pages_secret }}
        with:
          op: ${{ inputs.op }}
          client: ${{ inputs.client }}
          run: ${{ steps.plan.outputs.cmd }}
          preview: ${{ inputs.preview }}
          preview-note: ${{ steps.plan.outputs.note }}
          preview-exception: ${{ steps.plan.outputs.exception }}
          reason: ${{ inputs.reason }}
          org-key-passphrase: ${{ secrets.ORG_KEY_PASSPHRASE }}
          passphrase: ${{ secrets.PASSPHRASE }}
          roster-pass: ${{ secrets.ROSTER_PASS }}
          seed-passphrase: ${{ secrets.SEED_PASSPHRASE }}
          cloudflare-api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          cloudflare-account-id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
