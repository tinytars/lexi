name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"

  notify-failure:
    needs: [analyze]
    if: always() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
    uses: promontory-studio/autopilot/.github/workflows/notify-failure.yml@2c52091f36c1e2da50624954f826f31c31b0b536
    # `secrets: inherit` does not cross owners, so every secret is named.
    secrets:
      app-key: ${{ secrets.AUTOPILOT_APP_KEY }}
      # plover-autopilot is not installed on promontory-studio; this PAT is what reaches plover-factory.
      issue-token: ${{ secrets.RELEASE_PAT }}
    with:
      issue-repo: promontory-studio/plover-factory
      app-id: ${{ vars.AUTOPILOT_APP_ID }}
      assignee: pablo-tech
      title: CodeQL analysis failed
      context: The scheduled security scan did not complete, so no findings are being produced for this repository.
