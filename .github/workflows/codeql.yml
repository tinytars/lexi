name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  # Code scanning is free on a public repository and licensed on a private one, so whether the SARIF
  # can be uploaded is a property of the repository's visibility at the moment the job runs. This
  # gate asks for that visibility live rather than carrying it as a constant somebody has to
  # remember to flip: the analysis always runs, and only the upload is conditional.
  #
  # The two alternatives are both worse. `continue-on-error` would swallow a genuine CodeQL break
  # for as long as nobody read the log, and skipping the job outright would stop catching
  # extraction regressions for however long the repository stayed private.
  #
  # The design was proved by the case it was written for, which is now a dated instance rather than
  # the present condition. Through October 2026 this repository was private while published key
  # material was remediated, and every run completed its analysis and then died on the last step
  # with "Advanced Security must be enabled for this repository to use code scanning" — the
  # database built, every query ran, the SARIF exported, only the upload had nowhere to go. It went
  # public on 2026-10-18 and nothing here was touched: the gate reverted to uploading by itself,
  # which is what "nothing needs undoing" meant.
  #
  # Visibility is asked of the API rather than read from `github.event.repository`, which the
  # `schedule` payload does not carry. That is the trigger whose failure opens an issue on
  # plover-factory, so it is the one that must not be the trigger doing the guessing.
  gate:
    name: Upload gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      upload: ${{ steps.visibility.outputs.upload }}
    steps:
      - id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          visibility=$(gh api "repos/$REPO" --jq .visibility)
          if [ "$visibility" = "public" ]; then
            upload=always
          else
            upload=never
          fi
          echo "$REPO is $visibility — upload=$upload"
          echo "upload=$upload" >> "$GITHUB_OUTPUT"

  analyze:
    name: Analyze
    needs: [gate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:javascript-typescript"
          upload: ${{ needs.gate.outputs.upload }}

  notify-failure:
    needs: [gate, analyze]
    if: always() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
    uses: promontory-studio/pedalion-ci/.github/workflows/notify-failure.yml@6c2d307ada45c3202c2c395b2ac46056c47a40bf # v1.3.0
    # `secrets: inherit` does not cross owners, so every secret is named.
    secrets:
      app-key: ${{ secrets.AUTOPILOT_APP_KEY }}
    with:
      issue-repo: promontory-studio/plover-factory
      app-id: ${{ vars.AUTOPILOT_APP_ID }}
      assignee: pablo-tech
      title: CodeQL analysis failed
      context: The scheduled security scan did not complete, so no findings are being produced for this repository.
