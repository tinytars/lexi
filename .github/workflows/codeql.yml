name: CodeQL

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@c23de5a82f64bb08c6d9f28844551440ca298e76 # v4.38.1
        with:
          category: "/language:javascript-typescript"

  notify-failure:
    needs: [analyze]
    if: always() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
    uses: promontory-studio/pedalion-ci/.github/workflows/notify-failure.yml@0185de09d9447da6d439a1f0823c1631a5c0eb25 # v1.0.0
    # `secrets: inherit` does not cross owners, so every secret is named.
    secrets:
      app-key: ${{ secrets.AUTOPILOT_APP_KEY }}
    with:
      issue-repo: promontory-studio/plover-factory
      app-id: ${{ vars.AUTOPILOT_APP_ID }}
      assignee: pablo-tech
      title: CodeQL analysis failed
      context: The scheduled security scan did not complete, so no findings are being produced for this repository.
